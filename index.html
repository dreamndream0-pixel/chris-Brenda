<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brenda & Chris — Save the Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #f0ebe4;
    overflow-x: hidden;
  }

  /* ── SCROLL CONTAINER ── */
  .scroll-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* ── EACH PAGE ── */
  .page-section {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: #f0ebe4;
    padding: 0;
    opacity: 0;
    transform: translateY(60px);
    transition: opacity 0.8s cubic-bezier(0.25,0.46,0.45,0.94),
                transform 0.8s cubic-bezier(0.25,0.46,0.45,0.94);
  }

  .page-section.revealed {
    opacity: 1;
    transform: translateY(0);
  }

  /* first page fills viewport */
  .page-section:first-child {
    min-height: 100vh;
    align-items: center;
  }

  .page-img {
    display: block;
    width: 100%;
    max-width: 520px;
    height: auto;
    object-fit: contain;
  }

  /* first page image slightly taller feel */
  .page-section:first-child .page-img {
    max-width: 100vw;
    max-height: 100vh;
    object-fit: cover;
  }

  /* ── DIVIDER ── */
  .page-divider {
    width: 1px;
    height: 60px;
    background: linear-gradient(to bottom, transparent, #c8bdb2, transparent);
    margin: 0 auto;
  }

  /* ── SCROLL INDICATOR (first screen only) ── */
  .scroll-indicator {
    position: fixed;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
    z-index: 100;
    transition: opacity 0.6s;
  }

  .scroll-indicator.hidden { opacity: 0; }

  .scroll-indicator span {
    font-family: "Cormorant", serif;
    font-style: italic;
    font-size: 13px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.15em;
  }

  .scroll-line {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.6), transparent);
    animation: scrollPulse 2s ease-in-out infinite;
  }

  @keyframes scrollPulse {
    0%,100% { opacity: 0.4; transform: scaleY(1); }
    50% { opacity: 1; }
  }

  /* ── PAGE COUNTER ── */
  .page-counter {
    position: fixed;
    bottom: 32px;
    right: 36px;
    font-family: "Cormorant", serif;
    font-style: italic;
    font-size: 12px;
    letter-spacing: 0.2em;
    color: #a09080;
    z-index: 100;
    transition: opacity 0.4s;
  }

  @media (max-width: 600px) {
    .page-img { max-width: 100vw; }
  }
</style>
</head>

<!-- scroll indicator -->
<div class="scroll-indicator" id="scrollIndicator">
  <span>scroll</span>
  <div class="scroll-line"></div>
</div>

<!-- page counter -->
<div class="page-counter" id="pageCounter">1 / 5</div>

<script>
  // ── SCROLL REVEAL ──
  const sections = document.querySelectorAll('.page-section');
  const indicator = document.getElementById('scrollIndicator');
  const counter = document.getElementById('pageCounter');

  // Reveal first immediately
  sections[0].classList.add('revealed');

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('revealed');
        // update counter
        const idx = [...sections].indexOf(e.target);
        if (idx >= 0) counter.textContent = (idx+1) + ' / ' + sections.length;
      }
    });
  }, { threshold: 0.15 });

  sections.forEach(s => observer.observe(s));

  // ── HIDE SCROLL INDICATOR ──
  window.addEventListener('scroll', () => {
    if (window.scrollY > 80) indicator.classList.add('hidden');
    else indicator.classList.remove('hidden');
  }, { passive: true });
</script>
