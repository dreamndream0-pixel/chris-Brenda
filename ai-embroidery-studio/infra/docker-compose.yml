# Local stack: Redis + API + RQ worker (one image). Front-end runs separately (apps/web: npm run dev).
#   docker compose -f infra/docker-compose.yml up --build
# The worker and Redis sit on an internal network with no internet access; only the API is published.
services:
  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [internal]

  api:
    build: { context: .., dockerfile: infra/worker/Dockerfile }
    command: ["uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &env
      EMB_DATA_DIR: /data
      EMB_REDIS_URL: redis://redis:6379/0
      EMB_QUEUE_MODE: rq
      EMB_AUTH_MODE: dev
      EMB_SIGNING_SECRET: change-me-local-only
      EMB_PUBLIC_API_URL: http://localhost:8000
      EMB_CORS_ORIGINS: http://localhost:3000
    volumes: [emb-data:/data]
    ports: ["8000:8000"]
    networks: [internal, public]
    depends_on: [redis]

  worker:
    build: { context: .., dockerfile: infra/worker/Dockerfile }
    command: ["rq", "worker", "emb", "--url", "redis://redis:6379/0"]
    environment: *env
    volumes: [emb-data:/data]
    networks: [internal]
    cpus: 2
    mem_limit: 2g
    depends_on: [redis]

  gate-a:
    build: { context: .., dockerfile: infra/worker/Dockerfile }
    profiles: [test]
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    volumes: [../out:/out]
    command: ["python", "-m", "services.worker.gate_a", "--fixtures", "fixtures", "--out", "/out/gate-a"]

volumes:
  emb-data:

networks:
  internal: { internal: true }
  public: {}
